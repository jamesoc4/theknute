name: Peek reference site (temporary)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium } = require(process.env.NODE_PATH + '/playwright');
          (async () => {
            const b = await chromium.launch();
            for (const [name, w] of [['desktop', 1280], ['mobile', 390]]) {
              const p = await b.newPage({ viewport: { width: w, height: 900 }, deviceScaleFactor: 1 });
              await p.goto('https://nflwins2.com/', { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(3000);
              await p.screenshot({ path: name + '.jpg', type: 'jpeg', quality: 55, fullPage: true });
              if (name === 'desktop') {
                console.log('=====HTML=====');
                console.log(await p.content());
                console.log('=====TEXT=====');
                console.log(await p.evaluate(() => document.body.innerText));
              }
            }
            await b.close();
          })();
          JS
          NODE_PATH=$(npm root -g) node s.js
          for f in desktop mobile; do echo "=====IMG $f====="; base64 -w 200 $f.jpg; echo "=====END $f====="; done
