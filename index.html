<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Knute Leaderboard</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e3e5ea;
    --b1g: #b3261e; --sec: #e0302a; --mac: #6b4a1e; --acc: #3f7d2b; --nd: #1d3a6b; --gold: #c9a227;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #2a2e36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .sub button { font: inherit; color: inherit; background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; margin-left: 6px; cursor: pointer; }
  .player { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .rank { width: 28px; font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
  .player.first .rank { color: var(--gold); }
  .name { font-weight: 700; font-size: 17px; flex: 1; }
  .tb { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .pts { font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .pts small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .teams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .team { padding: 8px 10px; border-left: 4px solid; font-size: 13px; }
  .team + .team { border-right: 0; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .team .t { font-weight: 600; font-size: 12px; line-height: 1.2; min-height: 44px; display: flex; align-items: center; overflow-wrap: break-word; }
  .logo { width: 44px; height: 44px; object-fit: contain; display: block; }
  .games h4 .logo { width: 20px; height: 20px; }
  .games h4 { display: flex; align-items: center; gap: 6px; }
  .team .r { color: var(--muted); font-variant-numeric: tabular-nums; }
  .team .w { font-weight: 700; color: var(--text); }
  .B1G { border-color: var(--b1g); } .SEC { border-color: var(--sec); }
  .MAC { border-color: var(--mac); } .ACC { border-color: var(--acc); }
  .games { display: none; border-top: 1px solid var(--line); padding: 8px 14px 12px; font-size: 13px; }
  .player.open .games { display: block; }
  .games h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .games ul { list-style: none; margin: 0; padding: 0; }
  .games li { display: flex; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .games .res { width: 16px; font-weight: 700; }
  .games .W { color: #2e8b3e; } .games .L { color: #c0392b; }
  .games .up { color: var(--muted); }
  .err { color: #c0392b; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>The Knute Leaderboard</h1>
  <div class="sub">1 point per conference win · tiebreaker: ND points guess ·
    <span id="status">Loading…</span><button id="refresh">Refresh</button></div>
  <div id="board"></div>
</main>

<script>
// ---- League setup (edit here) ----------------------------------------------
// ESPN team IDs. Order per player: B1G, SEC, MAC, ACC.
const SEASON = 2026;
const PLAYERS = [
  { name: "Luke",    nd: 475, teams: [["Ohio State", 194], ["Alabama", 333], ["Miami (OH)", 193], ["Virginia Tech", 259]] },
  { name: "BGToe",   nd: 490, teams: [["Michigan", 130], ["LSU", 99], ["Western Michigan", 2711], ["Miami", 2390]] },
  { name: "Patrick", nd: 510, teams: [["Indiana", 84], ["Ole Miss", 145], ["Bowling Green", 189], ["SMU", 2567]] },
  { name: "KBO",     nd: 515, teams: [["Oregon", 2483], ["Texas", 251], ["Ohio", 195], ["Clemson", 228]] },
  { name: "Jamie",   nd: 507, teams: [["USC", 30], ["Texas A&M", 245], ["Toledo", 2649], ["Virginia", 258]] },
  { name: "Leemur",  nd: 497, teams: [["Penn State", 213], ["Georgia", 61], ["Sacramento State", 16], ["Louisville", 97]] },
];
const CONFS = ["B1G", "SEC", "MAC", "ACC"];
// Conference title games count as conference wins? Default: regular season only.
const COUNT_CHAMPIONSHIP_GAMES = false;
// Actual ND points total once known — ties are then broken by closest guess.
const ND_ACTUAL = null;
// Manual fixes if ESPN data is wrong: { teamId: conferenceWins }
const OVERRIDES = {};
// -----------------------------------------------------------------------------

const API = id => `https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/${id}/schedule?season=${SEASON}`;
const cache = {};
// ESPN logo, with the dark-background variant in dark mode. Falls back to the
// team name if the image fails to load (or hides, when the name is already shown).
const logo = (id, team, fallback = true) => `<picture>
  <source srcset="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/${id}.png" media="(prefers-color-scheme: dark)">
  <img class="logo" src="https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png" alt="${team}" title="${team}"
    onerror="this.closest('picture').outerHTML='${fallback ? `<span class=&quot;t&quot;>${team}</span>` : ""}'">
</picture>`;

async function loadTeam(id) {
  const res = await fetch(API(id), { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const games = [];
  for (const ev of data.events || []) {
    const comp = ev.competitions?.[0];
    if (!comp || !comp.conferenceCompetition) continue;
    const isTitle = (comp.notes || []).some(n => /championship/i.test(n.headline || ""))
      || ev.seasonType?.type === 3;
    if (isTitle && !COUNT_CHAMPIONSHIP_GAMES) continue;
    const us = comp.competitors.find(c => String(c.team?.id) === String(id));
    const them = comp.competitors.find(c => c !== us);
    if (!us || !them) continue;
    const done = !!comp.status?.type?.completed;
    const score = c => c.score?.displayValue ?? c.score ?? "";
    games.push({
      date: new Date(ev.date),
      opp: them.team?.shortDisplayName || them.team?.displayName || "?",
      home: us.homeAway === "home",
      done,
      win: done && us.winner === true,
      loss: done && us.winner === false,
      score: done ? `${score(us)}-${score(them)}` : "",
    });
  }
  games.sort((a, b) => a.date - b.date);
  const w = games.filter(g => g.win).length;
  const l = games.filter(g => g.loss).length;
  return { games, w: OVERRIDES[id] ?? w, l, error: null };
}

async function loadAll() {
  document.getElementById("status").textContent = "Loading…";
  const ids = PLAYERS.flatMap(p => p.teams.map(t => t[1]));
  await Promise.all(ids.map(async id => {
    try { cache[id] = await loadTeam(id); }
    catch (e) { cache[id] = { games: [], w: OVERRIDES[id] ?? 0, l: 0, error: e.message }; }
  }));
  render();
  document.getElementById("status").textContent =
    "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function render() {
  const rows = PLAYERS.map(p => ({
    ...p,
    total: p.teams.reduce((s, [, id]) => s + (cache[id]?.w || 0), 0),
  }));
  rows.sort((a, b) => b.total - a.total
    || (ND_ACTUAL != null ? Math.abs(a.nd - ND_ACTUAL) - Math.abs(b.nd - ND_ACTUAL) : 0));

  const open = new Set([...document.querySelectorAll(".player.open")].map(e => e.dataset.name));
  const board = document.getElementById("board");
  board.innerHTML = "";
  let rank = 0, prev = null;
  rows.forEach((p, i) => {
    const key = ND_ACTUAL != null ? `${p.total}|${Math.abs(p.nd - ND_ACTUAL)}` : `${p.total}`;
    if (key !== prev) rank = i + 1;
    prev = key;
    const el = document.createElement("div");
    el.className = "player" + (rank === 1 ? " first" : "") + (open.has(p.name) ? " open" : "");
    el.dataset.name = p.name;
    el.innerHTML = `
      <div class="head">
        <div class="rank">${rank}</div>
        <div class="name">${p.name}<span class="tb">ND ${p.nd}</span></div>
        <div class="pts">${p.total}<small>pts</small></div>
      </div>
      <div class="teams">${p.teams.map(([team, id], j) => {
        const t = cache[id] || {};
        return `<div class="team ${CONFS[j]}">${logo(id, team)}
          <div class="r">${t.error ? `<span class="err">no data</span>`
            : `<span class="w">${t.w ?? 0}</span>-${t.l ?? 0} conf`}</div></div>`;
      }).join("")}</div>
      <div class="games">${p.teams.map(([team, id], j) => {
        const t = cache[id] || { games: [] };
        const list = t.games.map(g => `<li>
          <span class="res ${g.win ? "W" : g.loss ? "L" : "up"}">${g.win ? "W" : g.loss ? "L" : "·"}</span>
          <span>${g.home ? "vs" : "@"} ${g.opp}</span>
          <span class="up">${g.done ? g.score : g.date.toLocaleDateString([], { month: "short", day: "numeric" })}</span>
        </li>`).join("");
        return `<h4>${logo(id, team, false)}${CONFS[j]} · ${team}</h4><ul>${list || `<li class="up">${t.error ? "Couldn't load: " + t.error : "No conference games found"}</li>`}</ul>`;
      }).join("")}</div>`;
    el.querySelector(".head").onclick = () => el.classList.toggle("open");
    board.appendChild(el);
  });
}

document.getElementById("refresh").onclick = loadAll;
loadAll();
</script>
</body>
</html>
